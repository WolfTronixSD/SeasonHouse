name: Build firmware
on:
  push:
  pull_request:
jobs:
  corner-spider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/**/platformio.ini') }}
      - run: pip install platformio
      - run: pio run -d firmware/corner-spider
      - name: Firmware shows match the simulator
        run: node tools/gen_seasons.mjs && git diff --exit-code firmware/corner-spider/include/seasons.h
