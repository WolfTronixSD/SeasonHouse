; Corner Spider - ESP32 haunted house prop
; Build:  pio run          Upload: pio run -t upload       Serial: pio device monitor
[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    gin66/FastAccelStepper@>=0.30.0
    dfrobot/DFRobotDFPlayerMini@^1.0.6
